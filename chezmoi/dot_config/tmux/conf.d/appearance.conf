# vim: set filetype=tmux :

## colors ######################################################################

# for colors in tmux
set -g default-terminal "screen-256color"

# for colors in terminal/nvim to work, I guess...
set-option -sa terminal-features ',xterm-256color:RGB'

## pane borders ################################################################

# enable + style
set -g pane-border-status top
set -g pane-border-lines "heavy"

# set pane border. In order of preference:
#
#   in a stack     the stack's trail ("server > 2 > logs"), this pane's own
#                  entry undimmed and the rest dim, w/ its place in the stack
#                  ("2 of 3") right aligned
#   @pane_title    the pane's title ("logs")
#   otherwise      the pane's path
#
# (see: tmux-pane-title, which owns @pane_title, and tmux-stack, which owns
# @stack_crumbs + @stack_pos)
#
# NOTE: the tests are "#{!=:...,}" (non-empty) rather than "#{?...}" (truthy),
# because tmux counts the string "0" as false and "0" is a usable title
#
# NOTE: "#[align=right]" opens a section of its own: everything after it is
# drawn flush against the pane's right edge, independently of what precedes it.
# The two sections are therefore padded separately -- the space *before* the
# marker pads the trail's right end, and "N of M" carries a space on either side
# w/in its own section
#
# NOTE: each branch carries its own padding, rather than the format being padded
# as a whole. A format that expands to nothing isn't drawn at all, but one that
# expands to whitespace is: a pane w/ neither a trail nor a title would wear its
# own padding as a gap in the border
#
# Appended a piece at a time so the nesting reads down the page. A trailing "\"
# continuation would work too, but folds the next line's indentation into the
# format; "-a" concatenates exactly
setw -g  pane-border-format "#{?#{!=:#{@stack_crumbs},}"
setw -ga pane-border-format   ", #{@stack_crumbs}#[nodim] #[align=right] #[dim]#{@stack_pos} "
setw -ga pane-border-format   ",#{?#{!=:#{@pane_title},}, #{@pane_title} ,}"
setw -ga pane-border-format "}"

## status bar ##################################################################

# NOTE: formatting is currently handled by theme, enabled below in plugins

## general

# enable --ugly-- status bar
set -g status on
set-option -g status-interval 5

## position

# put status bar at top of window by default
set-option -g status-position top
