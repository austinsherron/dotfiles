# vim: set filetype=tmux :

## navigation ##################################################################

# use 'j' instead of 'q' to display pane indices for direct pane navigation;
bind-key j display-panes

## open/close ##################################################################

# open: more intuitive shortcuts for splitting windows
bind-key - split-window -c "#{pane_current_path}"         # "vertical" split (one above, one below)
bind-key | split-window -h -c "#{pane_current_path}"      # "horizontal" split (one left, one right)

# open a fresh shell stacked in the current pane's slot (see: tmux-stack)
bind-key -n M-o run-shell "tmux-stack new '#{pane_id}'"

# close: promote the last-viewed stacked pane into the slot/just close it
bind-key -n M-X run-shell "tmux-stack close '#{pane_id}'"

## position ####################################################################

# swap via prefix + P + j (down)/k (up)
bind-key P switch-client -T swap_pane
bind-key -T swap_pane j swap-pane -D
bind-key -T swap_pane k swap-pane -U

## misc ########################################################################

# zoom
bind-key -n M-+ resize-pane -Z

# set pane title (empty clears the title)
#
# NOTE: via tmux-pane-title rather than "set-option -p @pane_title" directly --
# a stacked pane is listed by title in its stack's border trail (@stack_crumbs),
# and only tmux-pane-title rebuilds that trail. Setting the option by hand
# leaves the trail stale, i.e.: the new title never shows (see: tmux-pane-title)
bind-key . command-prompt -p "(title pane)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-pane-title -t '#{pane_id}' '%1'\""

## stacks ######################################################################

# cycle the panes stacked in the current slot, if stack exists and pane's exec doesn't
# bind these keys (i.e.: nvim)
#
# NOTE: (@pane_stack is tested for non-emptiness, not truthiness: it holds the stack's
# name, and the stack created from pane %0 is named "0", which tmux calls false)
bind-key -n M-[ if-shell -F "#{?#{m/r:^(n?vim|view)$,#{pane_current_command}},0,#{!=:#{@pane_stack},}}" \
    "run-shell \"tmux-stack prev '#{pane_id}'\"" \
    "send-keys M-["

bind-key -n M-] if-shell -F "#{?#{m/r:^(n?vim|view)$,#{pane_current_command}},0,#{!=:#{@pane_stack},}}" \
    "run-shell \"tmux-stack next '#{pane_id}'\"" \
    "send-keys M-]"

# list the panes stacked in the current slot
#
# NOTE: the popup is launched *through* run-shell because display-popup doesn't
# expand formats in its shell-command -- "#{pane_id}" would reach tmux-stack
# literally. Resolving the pane inside the popup instead doesn't work either:
# a popup gets a pane id of its own, so TMUX_PANE there is the popup's, not the
# pane it was opened from
bind-key -n M-i run-shell "tmux display-popup -E \"tmux-stack list '#{pane_id}' ; read -rn1\""

## resize ######################################################################

## incremental, w/ H, J, K, L

bind-key M-h resize-pane -L 2
bind-key M-l resize-pane -R 2
bind-key M-j resize-pane -D 1
bind-key M-k resize-pane -U 1
bind-key M-H resize-pane -L 10
bind-key M-L resize-pane -R 10
bind-key M-J resize-pane -D 5
bind-key M-K resize-pane -U 5

## based on % of window

# NOTE: these resize via tmux-resize-pane rather than resize-pane directly, so
# that the window's pre-resize layout is stashed and "b", below, can restore it

# v for resizing vertically
bind-key v command-prompt -p "(resize-pane vertically)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-resize-pane set '#{pane_id}' -y %1%%\""

# h for resizing horizontally
bind-key h command-prompt -p "(resize-pane horizontally)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-resize-pane set '#{pane_id}' -x %1%%\""

# e for resizing pane to 75%x90% of the window
bind-key e run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-pane set '#{pane_id}' -x 75% -y 90%"

# halve via prefix + H + | (width)/- (height)
bind-key H switch-client -T resize_pane
bind-key -T resize_pane | run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-pane set '#{pane_id}' -x 50%"
bind-key -T resize_pane - run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-pane set '#{pane_id}' -y 50%"

## undo

# b for restoring the window's layout from before the last resize above; press
# again to toggle back to the resized layout (see: tmux-resize-pane)
bind-key b run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-pane back '#{pane_id}'"

## using tmux-resize-layout

# r for resizing based on configured layouts
bind-key r command-prompt -p "(tmux-resize-layout)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-resize-layout -l %1\""

# alt-r for resizing based on configured layouts
bind-key R run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-layouts"

# l/L for adding new layouts
bind-key l command-prompt -p "(tmux-add-layout)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-add-layout '%1'\""
bind-key L command-prompt -p "(tmux-add-layout)" "run-shell \"ULOGGER_DISABLED=\"true\" tmux-add-layout '%1' --force\""
