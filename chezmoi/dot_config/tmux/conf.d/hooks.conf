# vim: set filetype=tmux :

## events

# enable focus events so pane-focus-in fires
set -g focus-events on

## resize

# resize all windows when tmux client attaches and resizes
set-hook -g client-attached 'run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-layouts"'
set-hook -g client-resized 'run-shell "ULOGGER_DISABLED=\"true\" tmux-resize-layouts"'

## claude

# unflag a pane whenever it gains focus, by any means (hotkey or manual
# navigation), reverting the color of the window it flagged; see:
# tmux-agent-status
set-hook -g pane-focus-in 'run-shell "ULOGGER_DISABLED=\"true\" tmux-agent-status clear #{pane_id}"'

## stacks

# stacked panes are "remain-on-exit on", so a stacked shell exiting leaves its
# slot in place long enough to promote the stack's last-viewed pane into it
set-hook -g pane-died 'run-shell "ULOGGER_DISABLED=\"true\" tmux-stack on-died #{hook_pane}"'
